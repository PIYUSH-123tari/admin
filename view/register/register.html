<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoLoop - Login</title>

  <link rel="stylesheet" href="register.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo-icon">♻</div>
      <div class="logo-text"><span class="eco">Eco</span><span class="loop">Loop</span></div>
    </div>
  </header>

  <!-- AUTH SECTION -->
  <section class="auth-wrapper">
    <div class="auth-card">

      <h1>Welcome Back!</h1>
      <p class="subtext">Sign in to your EcoLoop account</p>

      <form id="loginForm">

        <!-- Email -->
        <label>Email</label>
        <div class="input-box">
          <span class="icon">✉</span>
          <input type="email" id="loginEmail" placeholder="Enter your email" required="">
        </div>

        <!-- Admin ID -->
        <label>Admin ID</label>
        <div class="input-box">
          <span class="icon">🆔</span>
          <input type="text" id="loginAdminId" placeholder="Enter admin ID" required="">
        </div>

        <!-- Password -->
        <label>Password</label>
        <div class="input-box">
          <span class="icon">🔒</span>
          <input type="password" id="loginPassword" placeholder="Enter your password" required="">
          <span class="eye">👁</span>
        </div>

        <button type="submit" class="btn-main">Sign In</button>

      </form>

    </div>
  </section>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="register.js"></script>

</body></html>
